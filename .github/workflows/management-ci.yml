name: Print Management checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'server.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/management-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/management-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies from synchronized Bun lockfile
        run: bun install --frozen-lockfile
      - run: npm run lint
      - run: npm run test:management
      - run: npm run build
