name: Print Management checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'server.ts'
      - 'package.json'
      - '.github/workflows/management-ci.yml'
  push:
    branches:
      - 'feature/print-management-crm'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:management
      - run: npm run build
